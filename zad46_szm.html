<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Zadanie 46</title>
</head>
<body>

<script>

do
{
 var liczba1=prompt("Wysokość=");
 var h_szm=parseFloat(liczba1);
}
while(h_szm<=0);

do
{
 var liczba2=prompt("Podstawa=");
 var a_szm=parseFloat(liczba2);
}
while(!(a_szm>0));

var pole_szm=a_szm*h_szm/2;

document.write("Pole = "+pole_szm.toFixed(2)+" cm²");

</script>

</body>
</html>
