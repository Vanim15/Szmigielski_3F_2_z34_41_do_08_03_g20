<script>

var n_szm=parseInt(prompt("Podaj n"));

var silnia_szm=1;

if(n_szm==0)
{
 silnia_szm=1;
}
else
{
 for(var i_szm=1;i_szm<=n_szm;i_szm++)
 {
  silnia_szm=silnia_szm*i_szm;
 }
}

document.write(n_szm+"! = "+silnia_szm);

</script>
