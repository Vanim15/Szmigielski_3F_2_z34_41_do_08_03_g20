<script>

var ile_szm=parseInt(prompt("Ile razy powtórzyć napis?"));
var tekst_szm=prompt("Podaj inicjały");

for(var i_szm=1;i_szm<=ile_szm;i_szm++)
{
    for(var k_szm=1;k_szm<=i_szm;k_szm++)
    {
        document.write("&nbsp;&nbsp;");
    }

    document.write(i_szm+"_"+tekst_szm+"_"+i_szm+"<br>");
}

</script>
