<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Zadanie 53</title>
</head>
<body>

<script>

var a_szm=parseInt(prompt("Podaj wysokość a"));
var b_szm=parseInt(prompt("Podaj szerokość b"));

for(var i_szm=1;i_szm<=b_szm;i_szm++)
{
 document.write("*");
}

document.write("<br>");

var wiersz_szm="*";

for(var i_szm=1;i_szm<=b_szm-2;i_szm++)
{
 wiersz_szm=wiersz_szm+"&nbsp;&nbsp;";
}

wiersz_szm=wiersz_szm+"*";

for(var i_szm=1;i_szm<=a_szm-2;i_szm++)
{
 document.write(wiersz_szm+"<br>");
}

for(var i_szm=1;i_szm<=b_szm;i_szm++)
{
 document.write("*");
}

</script>

</body>
</html>
