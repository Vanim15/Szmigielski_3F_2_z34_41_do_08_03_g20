<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Zadanie 56</title>
</head>
<body>

<script>
    for (var i = 0; i <= 39; i++) {
        var w = (i * i) + i + 41;
        
        document.write("i=" + i + " &nbsp;&nbsp;&nbsp;&nbsp; w(" + i + ")=" + w + "<br>");

        if ((i + 1) % 5 === 0 && i < 39) {
            var kontynuuj = confirm("Wyświetlono kolejne 5 linii. Czy chcesz kontynuować?");
            if (!kontynuuj) {
                break;
            }
        }
    }
</script>

</body>
</html>
