<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Zadanie 57</title>
</head>
<body>

<script>
    var numer_w_dzienniku = 4;
    var koniec = numer_w_dzienniku + 15;
    var licznik_linii = 0;

    for (var i = numer_w_dzienniku; i <= koniec; i++) {
        var pierw_2 = Math.sqrt(i);
        var pierw_4 = Math.sqrt(pierw_2);

        document.write("l=" + i + " &nbsp;&nbsp;&nbsp;&nbsp; pierw_2(" + i + ")=" + pierw_2.toFixed(2) + " &nbsp;&nbsp;&nbsp;&nbsp; pierw_4(" + i + ")=" + pierw_4.toFixed(2) + "<br>");
        
        licznik_linii++;

        if (licznik_linii % 3 === 0 && i < koniec) {
            var kontynuuj = confirm("Wyświetlono kolejne 3 linie. Czy chcesz kontynuować?");
            if (!kontynuuj) {
                break;
            }
        }
    }
</script>

</body>
