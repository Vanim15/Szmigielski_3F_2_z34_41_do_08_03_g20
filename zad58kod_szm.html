<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Zadanie 58</title>
</head>
<body>

<script>
    var liczba1 = parseInt(prompt("Podaj pierwszą liczbę:"));
    var liczba2 = parseInt(prompt("Podaj drugą liczbę:"));

    if (liczba1 === liczba2) {
        confirm("Liczby są równe! Brak obliczeń.");
    } 
    else if (liczba1 < liczba2) {
        document.write("<div style='color: green; font-size: 24px;'>");
        for (var i = liczba1; i <= liczba2; i++) {
            if (i % 2 !== 0) {
                document.write(i + " ");
            }
        }
        document.write("</div>");
    } 
    else {
        document.write("<div style='color: blue; font-size: 12px;'>");
        for (var i = liczba1; i >= liczba2; i--) {
            if (i % 2 !== 0) {
                document.write(i + " ");
            }
        }
        document.write("</div>");
    }
</script>

</body>
</html>
